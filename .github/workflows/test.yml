name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 7 sources
        shell: pwsh
        run: ./tests/Parse.Tests.ps1

      - name: Run PowerShell 7 behavior tests
        shell: pwsh
        env:
          SYSIN_TEST_HOST: pwsh
        run: ./tests/Run.Tests.ps1

      - name: Parse Windows PowerShell 5.1 sources
        shell: powershell
        run: .\tests\Parse.Tests.ps1

      - name: Run Windows PowerShell 5.1 behavior tests
        shell: powershell
        env:
          SYSIN_TEST_HOST: powershell.exe
        run: .\tests\Run.Tests.ps1
