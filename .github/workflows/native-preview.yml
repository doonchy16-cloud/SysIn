name: native-preview

on:
  push:
    branches:
      - impl/v1.2-w1-native-core-windows
  pull_request:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore native solution
        shell: pwsh
        run: dotnet restore .\SysIn.sln

      - name: Build native solution
        shell: pwsh
        run: dotnet build .\SysIn.sln -c Debug --no-restore

      - name: Run native tests
        shell: pwsh
        run: dotnet test .\tests\Native\SysIn.Native.Tests\SysIn.Native.Tests.csproj -c Debug --no-build

      - name: Run existing V1.1 regression suite
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\Run.Tests.ps1
