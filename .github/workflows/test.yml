name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse PowerShell sources
        shell: pwsh
        run: ./tests/Parse.Tests.ps1

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester ./tests -Output Detailed
