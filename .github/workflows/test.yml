name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell sources
        shell: pwsh
        run: ./tests/Parse.Tests.ps1

      - name: Run behavior tests
        shell: pwsh
        run: ./tests/Run.Tests.ps1
